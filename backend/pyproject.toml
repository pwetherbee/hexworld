[project]
name = "hexworld"
version = "0.1.0"
description = "Multi-agent hex board creation system: a super agent plans, tile agents paint, the super reviews."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.60",
    "httpx>=0.27",
    "pillow>=10.4",
    "numpy>=2.0",
    "jsonschema>=4.23",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# Optional higher-quality grid recovery for diffusion output. pixelize.py falls back
# to its built-in palette-first block downsampler when this isn't installed.
pixel = ["proper-pixel-art>=0.1"]

[project.scripts]
hexworld = "hexworld.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hexworld"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
